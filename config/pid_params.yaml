flight:
  base_throttle: 0.0            # SDK: 0 = hover, +1 = max climb, -1 = max descent
  dt: 0.02
  chase_speed: 2800.0           # SEYIR hızı (100 km/h)
  takip_speed_margin: 800.0     # TAKIP'te hedefe göre fazla hız (yaklaşma marjı)

limits:
  min_pitch: -60.0
  max_pitch: 20.0
  # Canlı kalibrasyon (2026-07-10): sim stick'i SİMETRİK yorumlar,
  # gerçek eğim = stick * 60° (0.25→15°, 0.50→30°, 0.75→45°).
  pitch_full_scale_deg: 60.0
  # Fren (burun-yukarı) tavanı: kamera hedefi görüşte tutar. Eski davranış
  # fiilen ~43°'ye kadar geriye yatıyordu (normalizasyon hatası) → hedef
  # görüşten çıkıyordu.
  max_brake_pitch: 12.0
  min_throttle: -1.0
  max_throttle: 0.90

thresholds:
  seyir_dz: 800.0
  takip_dist: 4000.0
  seyir_fallback_dist: 500.0

inner_pid:
  pitch: {kp: 0.065, ki: 0.0, kd: 0.005}
  roll: {kp: 0.035, ki: 0.0, kd: 0.002}
  # kd: PID fallback, kd_gyro: gyro damping, int_limit: windup sınırı (deg·s)
  # kp/kd_gyro = 8.75 — pursuit v2'de kanıtlanan P:D oranı (0.002 yetersiz
  # sönümleme → yaw RMS 49 deg/s ölçüldü; 0.004 ile ~19'a düşer).
  yaw: {kp: 0.035, ki: 0.0003, kd: 0.002, kd_gyro: 0.004, int_limit: 150.0}

outer_pid:
  altitude: {kp: 0.40, ki: 0.06, kd: 0.10, clamp_min: -1.0, clamp_max: 0.75, int_limit: 6.0}
  # int_limit 20 iken integral en fazla ~2 derece eğim tutabiliyordu; yüksek
  # seyir hızını (20+ m/s) sürdürmek ~15 derece ister -> kalıcı hız açığı.
  # kp 4.0 + 30°/s slew: hız→pitch iç döngüsü ~3.4 s periyotlu limit-cycle
  # üretiyordu (ölçüm: v_des std 587 iken gerçek hız std 1166 cm/s — komuttan
  # bağımsız salınım). kp düşürüldü, kd sönümleme artırıldı, slew doygunluğu
  # (klasik limit-cycle kaynağı) 45°/s ile azaltıldı.
  speed: {kp: 2.5, ki: 0.50, kd: 0.35, clamp_min: -25.0, clamp_max: 45.0, int_limit: 150.0}

slew:
  pitch_max_change_per_sec: 45.0

# --- 5-metre arkadan takip güdümü ---
pursuit:
  follow_distance_cm: 1000.0  # hedefin kaç cm arkasında kal (5 m)

  # Dış döngü PID: imzalı mesafe hatası (cm) → hız düzeltmesi
  #   100 cm geride → +15 cm/s, 500 cm → +75 cm/s, 2000 cm → +300 cm/s
  distance_pid:
    kp: 0.70229
    ki: 0.00000
    kd: 0.50000
    int_limit: 100.0

  # Sqrt hız profili — hem yaklaşma hem geçiş simetrik sınırlanır
  #   v_safe = sqrt(2 * approach_accel * |s|)
  #   150 cm/s²  →  500 cm'de 387 cm/s, 2000 cm'de 775 cm/s kapanma limiti
  approach_accel_cms2: 900.00

  min_speed_cms: 100.0
  max_speed_cms: 2800.0

# --- Rota tabanlı takip (tests/python/test_route_intercept.py canlı takipçi) ---
route_intercept:
  lock_stable_laps: 4          # bu kadar tur üst üste kilitlendikten sonra rota dondurulur
  follow_distance_cm: 1000.0    # hedefin bu kadar (cm) arkasındaki takip yuvası izlenir
  lookahead_phi: 0.25          # halka üstünde carrot'un dronun önündeki fazı (rad)
  cross_track_band_cm: 2000.0  # elipse çekme bandı (cm)
  nominal_target_speed_cms: 1700.0  # Talon seyir hızı varsayımı
  # Hız (catch) kanalı PD: P-only 0.8 kazanç, LPF+hız-PID gecikmesiyle yuva
  # etrafında sönümsüz salınım üretiyordu (v_des std ~800 cm/s, mesafe p2p
  # ~40 m, hedefe 15 cm'e kadar tehlikeli yaklaşma). catch_damp kapanma
  # hızını söndürür, arc_tau kısaltılarak faz gecikmesi azaltıldı.
  catch_gain: 0.5              # yuvaya yay farkı (cm) -> ek hız (cm/s)
  catch_damp: 1.2              # yay farkı türevi sönümlemesi (boyutsuz)
                               # [1.2→1.5: fren tavanı 12° olunca daha erken
                               # hız kesme gerekir — sert pitch freni yerine]
  slot_approach_accel_cms2: 250.0  # sqrt yaklaşma profili: 12° fren yatışının
                               # sağlayabildiği ~2.5 m/s² yavaşlama varsayımı;
                               # kapanma hızı sqrt(2·a·yay) ile sınırlanır →
                               # yuva aşımı (hedefin dibine dalma) engellenir
  arc_tau_s: 0.5               # yay farkı LPF zaman sabiti (s) [eski: ~1.0]
  ring_v_auth_cms: 1400.0      # halka üstü hız düzeltme yetkisi (± cm/s)
  lead_time_s: 1.0             # GPS gecikme telafisi: hedef fazı omega*lead kadar öne alınır
  wait_for_lock: true          # ilk yörünge kilidine kadar hover'da bekle, sonra harekete geç

# --- Kamikaze taarruz güdümü (tests/python/test_route_kamikaze.py) ---
# Takip yerine hedefi rota üzerinde en erken yakalama (lead intercept)
# noktasında VURUR. Yuva/takip mesafesi yok; tam hızla çarpışmaya dalar.
route_kamikaze:
  # DİKKAT: taarruz hızı hedef hızının (~1500-1800 cm/s) belirgin ÜSTÜNDE
  # olmalı; 1800'de kapanma hızı ~0 kalır, intercept çözümü bulunamaz ve
  # dron hedefi asla vuramaz (150 s'de 8 teğet geçiş, 0 çarpışma ölçüldü).
  attack_speed_cms: 2800.0     # taarruz hızı (dron tam hız kapanma)
  terminal_range_cm: 3000.0    # terminal dalış bu menzilde kademeli başlar (1000'de alçalmaya vakit kalmıyor)
  hit_radius_cm: 500.0         # rapor metriği: en yakın geçiş bu yarıçapla kıyaslanır
  lead_time_s: 1.0             # GPS gecikme telafisi (solve_intercept saatine eklenir)
  wait_for_lock: true          # ilk yörünge kilidine kadar hover'da bekle, sonra taarruza geç
  lock_stable_laps: 4          # bu kadar tur kilit sonrası rota dondurulur (kararlı intercept)
  # Terminal dalış bias'ı: eski davranış (400) dronu daima hedef irtifasının
  # ALTINA nişanlatıyordu — oysa ölçümde dron zaten zamanın %70'inde hedefin
  # ALTINDA kalıyor; bias ıskalayı büyütüyordu. 0 = eş-irtifa (hedefin gerçek
  # yüksekliğine dal), çarpışmayı dikeyde ortalar.
  terminal_descent_cm: 0.0