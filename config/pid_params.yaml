flight:
  base_throttle: 0.0            # SDK: 0 = hover, +1 = max climb, -1 = max descent
  camera_tilt: 20.0
  dt: 0.02
  chase_speed: 2800.0           # SEYIR hızı (100 km/h)
  takip_speed_margin: 500.0     # TAKIP'te hedefe göre fazla hız (yaklaşma marjı)

limits:
  min_pitch: -20.0
  max_pitch: 20.0
  min_throttle: -1.0
  max_throttle: 0.8

thresholds:
  seyir_dz: 800.0
  takip_dist: 4000.0
  seyir_fallback_dist: 100.0

inner_pid:
  pitch: {kp: 0.045, ki: 0.0, kd: 0.0005}
  roll: {kp: 0.035, ki: 0.0, kd: 0.0002}
  yaw: {kp: 0.035, ki: 0.0005, kd: 0.002}

outer_pid:
  altitude: {kp: 0.20, ki: 0.02, kd: 0.05, clamp_min: -1.0, clamp_max: 0.45, int_limit: 2.0}
  speed: {kp: 2.5, ki: 0.1, kd: 0.1, clamp_min: -45.0, clamp_max: 45.0, int_limit: 20.0}

slew:
  pitch_max_change_per_sec: 20.0

# --- 5-metre arkadan takip güdümü ---
pursuit:
  follow_distance_cm: 2500.0  # hedefin kaç cm arkasında kal (5 m)

  # Dış döngü PID: imzalı mesafe hatası (cm) → hız düzeltmesi
  #   100 cm geride → +15 cm/s, 500 cm → +75 cm/s, 2000 cm → +300 cm/s
  distance_pid:
    kp: 0.70229
    ki: 0.00000
    kd: 0.50000
    int_limit: 100.0

  # Sqrt hız profili — hem yaklaşma hem geçiş simetrik sınırlanır
  #   v_safe = sqrt(2 * approach_accel * |s|)
  #   150 cm/s²  →  500 cm'de 387 cm/s, 2000 cm'de 775 cm/s kapanma limiti
  approach_accel_cms2: 200.00

  min_speed_cms: 100.0
  max_speed_cms: 2800.0