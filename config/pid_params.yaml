flight:
  base_throttle: 0.0            # SDK: 0 = hover, +1 = max climb, -1 = max descent
  camera_tilt: 5.0
  dt: 0.02
  chase_speed: 1500.0           # SEYIR hızı (100 km/h)
  takip_speed_margin: 500.0     # TAKIP'te hedefe göre fazla hız (yaklaşma marjı)
  angajman_speed_margin: 1000.0 

limits:
  min_pitch: -20.0
  max_pitch: 20.0
  min_throttle: -1.0
  max_throttle: 0.8

thresholds:
  seyir_dz: 800.0
  takip_dist: 8000.0
  seyir_fallback_dist: 5000.0
  angajman_dist: 4500.0        



inner_pid:
  pitch: {kp: 0.45, ki: 0.0002, kd: 0.0005}
  roll: {kp: 0.35, ki: 0.0002, kd: 0.0002}
  yaw: {kp: 0.075, ki: 0.0002, kd: 0.0002}

outer_pid:
  altitude: {kp: 0.20, ki: 0.02, kd: 0.05, clamp_min: -1.0, clamp_max: 0.45, int_limit: 2.0}
  speed: {kp: 2.5, ki: 0.5, kd: 0.1, clamp_min: -45.0, clamp_max: 45.0, int_limit: 20.0}

slew:
  pitch_max_change_per_sec: 20.0

pursuit:
  follow_distance_cm: 1000.0   # hedefin kaç cm arkasında kal (değiştirilebilir)

  # Dış döngü PID: imzalı mesafe hatası (cm) → hız düzeltmesi (cm/s)
  # P: anlık hata, D: yaklaşma/uzaklaşma hızı (overshoot önler), I: sabit kayma giderir
  distance_pid:
    kp: 0.8
    ki: 0.003
    kd: 0.01
    int_limit: 200.0          # integral kaymasını ±200 cm/s ile sınırla

  min_speed_cms: 50.0        # minimum ileri hız (durma/geri gitme engeli)
  max_speed_cms: 1500.0       # maksimum yaklaşma hızı

vision:
  conf_threshold: 0.50          # RF-DETR güven eşiği
  resize_scale: 0.7             # Ekran yakalama küçültme oranı
  monitor_index: 1              # Yakalanacak ekran (1 = ana ekran)
  output_fps: 30.0              # Çıktı video FPS değeri
  track_timeout: 4.0             # Algılamadan sonra TCTrack ile takip süresi (saniye)
  track_score_min: 0.30          # Takip kayıp eşiği
  kp_vision_yaw: 0.045            # Kamera takibi yatay P kazancı
  kp_vision_pitch: 0.025          # Kamera takibi düşey P kazancı
  vision_max_dist: 2500.0        # Kamera takibinin devreye gireceği maksimum 3D mesafe (cm)